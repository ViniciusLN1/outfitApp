name: outfit_app
description: Guarda-roupa digital e outfit planner.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database (SQLite reativo)
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.31
  path_provider: ^2.1.5
  path: ^1.9.1

  # Camera
  camera: ^0.11.0+2

  # Imagens com transparência PNG (sem fundo)
  extended_image: ^9.0.0

  # HTTP para chamar o backend Python
  http: ^1.6.0

  # UUID para geração de IDs
  uuid: ^4.5.3

  # Seleção de imagem da galeria
  image_picker: ^1.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.26.0
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
